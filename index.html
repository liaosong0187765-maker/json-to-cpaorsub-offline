<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mars-y - 工具与博客</title>
  <meta name="description" content="mars-y 静态站点入口，包含本地转换工具和每日博客。">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <style>
    :root {
      --bg: #f4f1eb;
      --surface: #fffaf3;
      --text: #1f1f20;
      --muted: #69635c;
      --line: rgba(31, 31, 32, 0.1);
      --accent: #c9694a;
      --accent-dark: #9d482d;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    a { color: inherit; text-decoration: none; }
    .shell { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
    .nav, .main, .footer { width: min(1080px, calc(100% - 40px)); margin-inline: auto; }
    .nav { min-height: 72px; display: flex; align-items: center; gap: 18px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 850; }
    .brand img { width: 32px; height: 32px; border-radius: 8px; }
    .links { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    .links a, .button { min-height: 38px; display: inline-flex; align-items: center; justify-content: center; padding: 0 14px; border-radius: 999px; font-weight: 750; }
    .links a { color: var(--muted); }
    .links a:hover { color: var(--accent-dark); background: rgba(201, 105, 74, 0.1); }
    .main { padding: clamp(44px, 8vw, 92px) 0; }
    .eyebrow { color: var(--accent-dark); font-size: 13px; font-weight: 850; text-transform: uppercase; letter-spacing: 0.08em; }
    h1 { max-width: 860px; margin: 16px 0 0; font-size: clamp(44px, 8vw, 84px); line-height: 1.02; letter-spacing: 0; }
    .copy { max-width: 720px; margin: 22px 0 0; color: var(--muted); font-size: 19px; line-height: 1.75; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; margin-top: 42px; }
    .card { min-height: 240px; display: flex; flex-direction: column; padding: 28px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: 0 18px 52px rgba(45, 36, 28, 0.08); }
    .card small { color: var(--accent-dark); font-weight: 850; }
    .card h2 { margin: 14px 0 0; font-size: 30px; line-height: 1.2; }
    .card p { color: var(--muted); line-height: 1.7; }
    .button { margin-top: auto; width: fit-content; background: var(--accent); color: white; }
    .footer { padding: 28px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
    @media (max-width: 760px) {
      .nav { align-items: flex-start; flex-direction: column; padding: 16px 0; }
      .links { margin-left: 0; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="nav">
      <a class="brand" href="index.html" aria-label="mars-y">
        <img src="assets/favicon.ico" alt="mars-y logo">
        <span>mars-y</span>
      </a>
      <nav class="links" aria-label="主导航">
        <a href="tools/json-to-cpaorsub-offline/">转换工具</a>
        <a href="blog/">博客</a>
        <a href="README.md">README</a>
      </nav>
    </header>

    <main class="main">
      <div class="eyebrow">Mars-y Site</div>
      <h1>欢迎回来</h1>
      <p class="copy">让ai点燃创意</p>

      <section class="grid" aria-label="站点入口">
        <a class="card" href="tools/json-to-cpaorsub-offline/">
          <small>Tool</small>
          <h2>JSON 转 CPA / SUB</h2>
          <p>`json-to-cpaorsub-offline`本地 工具</p>
          <span class="button">打开工具</span>
        </a>
        <a class="card" href="blog/posts/2026-06-03-ai-three-years-nine-lessons/">
          <small>Blog</small>
          <h2>每日内容博客</h2>
          <p>分享ai热点</p>
          <span class="button">阅读第一篇</span>
        </a>
      </section>
    </main>

    <footer class="footer">mars-y static site on Cloudflare Pages</footer>
  </div>
</body>
</html>
